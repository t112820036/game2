<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberSlide: 幾何對位 - 全域滑移解謎</title>
  <!-- Google Fonts: Orbitron & Rajdhani -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       CyberSlide Aesthetics - 全域滑移幾何賽博風格
       ========================================================================== */
    :root {
      --bg-dark: #080a0f;
      --panel-bg: #111622;
      --border-color: #2a364f;
      --neon-cyan: #00f3ff;
      --neon-green: #00ff66;
      --neon-gold: #ffcc00;
      --neon-purple: #cc00ff;
      --neon-red: #ff0055;
      --font-tech: 'Orbitron', sans-serif;
      --font-num: 'Rajdhani', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #1a2233 0%, var(--bg-dark) 100%);
      color: #e2e8f0;
      font-family: var(--font-tech);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* CRT 復古掃描線 */
    .crt-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.25) 50%
      ), linear-gradient(
        90deg,
        rgba(255, 0, 0, 0.02),
        rgba(0, 255, 0, 0.01),
        rgba(0, 0, 255, 0.02)
      );
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
      z-index: 999;
    }

    /* 主框架 */
    .game-wrapper {
      width: 95%;
      max-width: 850px;
      background: var(--panel-bg);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 
        0 0 30px rgba(0, 243, 255, 0.2),
        inset 0 0 15px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* 頂部 Header */
    .game-header {
      background: #171d2c;
      padding: 15px 25px;
      border-bottom: 2px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .game-title {
      font-family: var(--font-tech);
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--neon-cyan);
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.6);
    }

    .game-subtitle {
      font-size: 0.75rem;
      color: #6a7b95;
      letter-spacing: 1px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 6px 12px;
      font-family: var(--font-tech);
      font-size: 0.8rem;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background: rgba(0, 243, 255, 0.2);
      box-shadow: 0 0 8px rgba(0, 243, 255, 0.4);
    }

    /* 主體區塊 */
    .game-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 10 關選關列表 */
    .level-selector-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 6px;
      width: 100%;
      max-width: 650px;
      margin-bottom: 15px;
    }

    .lvl-btn {
      padding: 6px 0;
      background: #141a26;
      border: 1px solid var(--border-color);
      color: #586980;
      font-family: var(--font-num);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .lvl-btn:hover {
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
    }

    .lvl-btn.active {
      border-color: var(--neon-cyan);
      color: #000;
      background: var(--neon-cyan);
      box-shadow: 0 0 10px var(--neon-cyan);
    }

    .lvl-btn.cleared {
      border-color: var(--neon-green);
      color: var(--neon-green);
      background: rgba(0, 255, 102, 0.12);
    }

    .lvl-btn.cleared.active {
      background: var(--neon-green);
      color: #000;
      box-shadow: 0 0 10px var(--neon-green);
    }

    /* HUD 資訊看板 */
    .hud-info {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 520px;
      background: #0d111a;
      border: 1px solid var(--border-color);
      padding: 10px 20px;
      border-radius: 6px;
      margin-bottom: 15px;
    }

    .hud-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hud-label {
      font-size: 0.7rem;
      color: #6a7b95;
    }

    .hud-val {
      font-family: var(--font-num);
      font-size: 1.2rem;
      font-weight: 700;
      color: #ffffff;
    }

    /* 遊戲畫布與地圖 */
    .board-container {
      background: #090c12;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 15px;
      min-height: 320px;
    }

    .game-grid {
      display: grid;
      gap: 4px;
    }

    .cell {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.4rem;
      position: relative;
    }

    /* 牆壁 */
    .cell.wall {
      background: linear-gradient(135deg, #283244 0%, #151c28 100%);
      border: 1px solid #3c4b66;
      box-shadow: inset 0 0 5px rgba(255, 255, 255, 0.1);
    }

    /* 地板 */
    .cell.floor {
      background: rgba(20, 26, 38, 0.6);
      border: 1px solid rgba(42, 54, 79, 0.4);
    }

    /* 目標區 Target Slot */
    .target-icon {
      width: 28px;
      height: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 4px;
      opacity: 0.85;
      animation: pulse-glow 2s infinite alternate;
    }

    .target-icon.target-1 { border: 2px dashed var(--neon-green); color: var(--neon-green); }
    .target-icon.target-2 { border: 2px dashed var(--neon-cyan); color: var(--neon-cyan); }
    .target-icon.target-3 { border: 2px dashed var(--neon-gold); color: var(--neon-gold); }
    .target-icon.target-4 { border: 2px dashed var(--neon-purple); color: var(--neon-purple); }

    @keyframes pulse-glow {
      0% { transform: scale(0.9); opacity: 0.6; }
      100% { transform: scale(1.05); opacity: 1; }
    }

    /* 全域滑移動態箱子 */
    .box {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 1.1rem;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
      z-index: 10;
      transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .box.box-1 { background: radial-gradient(circle, #00ff66, #008833); border: 2px solid #ffffff; color: #000; box-shadow: 0 0 12px var(--neon-green); }
    .box.box-2 { background: radial-gradient(circle, #00f3ff, #0088aa); border: 2px solid #ffffff; color: #000; box-shadow: 0 0 12px var(--neon-cyan); }
    .box.box-3 { background: radial-gradient(circle, #ffcc00, #aa8800); border: 2px solid #ffffff; color: #000; box-shadow: 0 0 12px var(--neon-gold); }
    .box.box-4 { background: radial-gradient(circle, #cc00ff, #7700aa); border: 2px solid #ffffff; color: #fff; box-shadow: 0 0 12px var(--neon-purple); }

    .box.matched {
      animation: box-matched-bounce 0.3s ease-out;
      border-color: #ffffff;
      filter: brightness(1.25);
    }

    @keyframes box-matched-bounce {
      0% { transform: scale(0.85); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    /* 控制列與 D-Pad */
    .control-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .action-buttons {
      display: flex;
      gap: 15px;
    }

    .btn-cyber {
      background: linear-gradient(180deg, #1e2838 0%, #101622 100%);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      font-family: var(--font-tech);
      font-size: 0.85rem;
      padding: 8px 18px;
      cursor: pointer;
      border-radius: 4px;
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    .btn-cyber:hover {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 12px var(--neon-cyan);
    }

    /* D-Pad 十字鍵 */
    .dpad-container {
      display: grid;
      grid-template-columns: repeat(3, 48px);
      grid-template-rows: repeat(3, 48px);
      gap: 6px;
      margin-top: 5px;
    }

    .dpad-btn {
      background: #161e2e;
      border: 1px solid var(--border-color);
      color: var(--neon-cyan);
      font-size: 1.2rem;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .dpad-btn:active {
      background: var(--neon-cyan);
      color: #000;
    }

    .dpad-up { grid-column: 2; grid-row: 1; }
    .dpad-left { grid-column: 1; grid-row: 2; }
    .dpad-right { grid-column: 3; grid-row: 2; }
    .dpad-down { grid-column: 2; grid-row: 3; }

    /* 全通關 Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(5, 7, 10, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active { display: flex; }

    .modal-panel {
      background: linear-gradient(135deg, #1a2233 0%, #0d111a 100%);
      border: 2px solid var(--neon-green);
      padding: 35px;
      border-radius: 10px;
      text-align: center;
      max-width: 450px;
      width: 90%;
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.3);
    }

    .modal-title {
      font-family: var(--font-tech);
      font-size: 1.8rem;
      color: var(--neon-green);
      text-shadow: 0 0 10px var(--neon-green);
      margin-bottom: 10px;
    }

    .modal-desc {
      color: #a0aec0;
      font-size: 0.95rem;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .level-selector-grid { grid-template-columns: repeat(5, 1fr); }
      .cell { width: 36px; height: 36px; font-size: 1.1rem; }
      .box { width: 30px; height: 30px; font-size: 0.9rem; }
      .target-icon { width: 22px; height: 22px; }
      .game-title { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <div class="crt-overlay"></div>

  <div class="game-wrapper">
    <header class="game-header">
      <div>
        <h1 class="game-title">CyberSlide // 幾何對位</h1>
        <p class="game-subtitle">SIMULTANEOUS BLOCK SLIDING PUZZLE</p>
      </div>
      <div class="header-actions">
        <button id="sound-btn" class="btn-icon">音效: ON</button>
        <button id="reset-progress-btn" class="btn-icon" style="border-color:var(--neon-red); color:var(--neon-red);">重設紀錄</button>
      </div>
    </header>

    <main class="game-body">
      <!-- 關卡選擇列表 -->
      <div id="level-grid" class="level-selector-grid"></div>

      <!-- HUD 看板 -->
      <div class="hud-info">
        <div class="hud-item">
          <span class="hud-label">當前關卡</span>
          <span id="hud-level" class="hud-val">01 / 10</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">滑移步數</span>
          <span id="hud-steps" class="hud-val">0</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">幾何對位</span>
          <span id="hud-matched" class="hud-val">0 / 1</span>
        </div>
      </div>

      <!-- 核心地圖畫布 -->
      <div class="board-container">
        <div id="game-grid" class="game-grid"></div>
      </div>

      <!-- 控制面板 -->
      <div class="control-panel">
        <div class="action-buttons">
          <button id="btn-undo" class="btn-cyber">復原 (Undo)</button>
          <button id="btn-restart" class="btn-cyber">重置本關</button>
          <button id="btn-prev" class="btn-cyber">上一關</button>
          <button id="btn-next" class="btn-cyber">下一關</button>
        </div>

        <!-- 觸控/點擊 D-Pad -->
        <div class="dpad-container">
          <button class="dpad-btn dpad-up" id="btn-up">▲</button>
          <button class="dpad-btn dpad-left" id="btn-left">◀</button>
          <button class="dpad-btn dpad-right" id="btn-right">▶</button>
          <button class="dpad-btn dpad-down" id="btn-down">▼</button>
        </div>
      </div>
    </main>
  </div>

  <!-- 全通關 Modal -->
  <div id="win-modal" class="modal-overlay">
    <div class="modal-panel">
      <h2 class="modal-title">ALL STAGES ALIGNED</h2>
      <p class="modal-desc">
        恭喜！您已成功運用牆壁障礙與全域滑移動力學，完成全部幾何圖形的對位與重構！
      </p>
      <button id="modal-close-btn" class="btn-cyber" style="border-color:var(--neon-green); color:var(--neon-green);">返回關卡</button>
    </div>
  </div>

  <script>
    /**
     * CyberSlide Global Simultaneous Sliding Engine
     */
    document.addEventListener('DOMContentLoaded', () => {
      // 幾何圖形定義：
      // 1: 正方形 (Square - 🟩), 2: 圓形 (Circle - 🔵), 3: 三角形 (Triangle - 🔺), 4: 菱形 (Diamond - 🔷)
      const SHAPES = {
        1: { name: 'Square', symbol: '■', class: 'box-1', targetClass: 'target-1' },
        2: { name: 'Circle', symbol: '●', class: 'box-2', targetClass: 'target-2' },
        3: { name: 'Triangle', symbol: '▲', class: 'box-3', targetClass: 'target-3' },
        4: { name: 'Diamond', symbol: '◆', class: 'box-4', targetClass: 'target-4' }
      };

      // 10 個經過精心嚴謹測試的全域滑移關卡
      const LEVELS = [
        {
          name: "關卡 01: 直線對位",
          map: [
            "#######",
            "#A...1#",
            "#######"
          ]
        },
        {
          name: "關卡 02: 障礙卡位",
          map: [
            "#######",
            "#A...1#",
            "#..#..#",
            "#B...2#",
            "#######"
          ]
        },
        {
          name: "關卡 03: 錯位高低差",
          map: [
            "#######",
            "#A...1#",
            "#.#.2.#",
            "#B....#",
            "#######"
          ]
        },
        {
          name: "關卡 04: 十字死角",
          map: [
            "########",
            "#..#...#",
            "#A...1.#",
            "#...#..#",
            "#..B.2.#",
            "########"
          ]
        },
        {
          name: "關卡 05: 三體滑移",
          map: [
            "#########",
            "#A....1.#",
            "#..#....#",
            "#B....2.#",
            "#....#..#",
            "#C....3.#",
            "#########"
          ]
        },
        {
          name: "關卡 06: 角落碰撞",
          map: [
            "#######",
            "#A..#1#",
            "#.#...#",
            "#B..2.#",
            "#######"
          ]
        },
        {
          name: "關卡 07: 彼此阻擋 (相互借力)",
          map: [
            "#######",
            "#A.B..#",
            "#..#1.#",
            "#...2.#",
            "#######"
          ]
        },
        {
          name: "關卡 08: 四色四象對位",
          map: [
            "#########",
            "#A..#..1#",
            "#B...#.2#",
            "#C.#...3#",
            "#D...#.4#",
            "#########"
          ]
        },
        {
          name: "關卡 09: 迴廊滑移迷宮",
          map: [
            "#########",
            "#A..#..1#",
            "#.#...#.#",
            "#..B.2..#",
            "#.#...#.#",
            "#C..#..3#",
            "#########"
          ]
        },
        {
          name: "關卡 10: 幾何對位大師",
          map: [
            "###########",
            "#A...#...1#",
            "#.B....2..#",
            "#..#C#....#",
            "#...3#...D#",
            "#......4..#",
            "###########"
          ]
        }
      ];

      // 遊戲狀態變數
      let currentLevelIndex = 0;
      let gridWidth = 0;
      let gridHeight = 0;
      let walls = [];     // 2D boolean
      let targets = [];   // [{ r, c, shapeId }]
      let boxes = [];     // [{ r, c, shapeId }]
      let historyStack = [];
      let stepCount = 0;
      let soundEnabled = true;
      let clearedLevels = JSON.parse(localStorage.getItem('cyberslide_cleared') || '[]');

      // DOM 引用
      const levelGrid = document.getElementById('level-grid');
      const gameGrid = document.getElementById('game-grid');
      const hudLevel = document.getElementById('hud-level');
      const hudSteps = document.getElementById('hud-steps');
      const hudMatched = document.getElementById('hud-matched');

      const btnUndo = document.getElementById('btn-undo');
      const btnRestart = document.getElementById('btn-restart');
      const btnPrev = document.getElementById('btn-prev');
      const btnNext = document.getElementById('btn-next');
      const soundBtn = document.getElementById('sound-btn');
      const resetProgressBtn = document.getElementById('reset-progress-btn');

      const winModal = document.getElementById('win-modal');
      const modalCloseBtn = document.getElementById('modal-close-btn');

      // Web Audio API 音效引擎
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      function playSound(type) {
        if (!soundEnabled) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'slide') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(150, now + 0.1);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
        } else if (type === 'match') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'clear') {
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g);
            g.connect(audioCtx.destination);
            o.frequency.value = freq;
            g.gain.setValueAtTime(0.15, now + i * 0.08);
            g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.25);
            o.start(now + i * 0.08);
            o.stop(now + i * 0.08 + 0.25);
          });
        }
      }

      // 渲染關卡列表
      function renderLevelSelector() {
        levelGrid.innerHTML = '';
        LEVELS.forEach((lvl, idx) => {
          const btn = document.createElement('button');
          btn.className = `lvl-btn ${idx === currentLevelIndex ? 'active' : ''} ${clearedLevels.includes(idx) ? 'cleared' : ''}`;
          btn.textContent = String(idx + 1).padStart(2, '0');
          btn.addEventListener('click', () => loadLevel(idx));
          levelGrid.appendChild(btn);
        });
      }

      // 載入關卡
      function loadLevel(idx) {
        currentLevelIndex = idx;
        const levelData = LEVELS[idx];
        const mapStrings = levelData.map;

        gridHeight = mapStrings.length;
        gridWidth = Math.max(...mapStrings.map(s => s.length));

        walls = Array.from({ length: gridHeight }, () => new Array(gridWidth).fill(false));
        targets = [];
        boxes = [];
        historyStack = [];
        stepCount = 0;

        for (let r = 0; r < gridHeight; r++) {
          const rowStr = mapStrings[r];
          for (let c = 0; c < rowStr.length; c++) {
            const ch = rowStr[c];
            if (ch === '#') {
              walls[r][c] = true;
            } else if (['1', '2', '3', '4'].includes(ch)) {
              targets.push({ r, c, shapeId: parseInt(ch, 10) });
            } else if (['A', 'B', 'C', 'D'].includes(ch)) {
              const charMap = { 'A': 1, 'B': 2, 'C': 3, 'D': 4 };
              boxes.push({ r, c, shapeId: charMap[ch] });
            }
          }
        }

        hudLevel.textContent = `${String(idx + 1).padStart(2, '0')} / ${LEVELS.length}`;
        btnPrev.disabled = (idx === 0);
        btnNext.disabled = (idx === LEVELS.length - 1);

        renderLevelSelector();
        renderBoard();
        updateHUD();
      }

      // 渲染地圖 Grid
      function renderBoard() {
        gameGrid.style.gridTemplateColumns = `repeat(${gridWidth}, 1fr)`;
        gameGrid.innerHTML = '';

        for (let r = 0; r < gridHeight; r++) {
          for (let c = 0; c < gridWidth; c++) {
            const cell = document.createElement('div');
            cell.className = 'cell';

            if (walls[r][c]) {
              cell.classList.add('wall');
            } else {
              cell.classList.add('floor');

              // 渲染目標點
              const target = targets.find(t => t.r === r && t.c === c);
              if (target) {
                const targetIcon = document.createElement('div');
                targetIcon.className = `target-icon ${SHAPES[target.shapeId].targetClass}`;
                targetIcon.textContent = SHAPES[target.shapeId].symbol;
                cell.appendChild(targetIcon);
              }

              // 渲染箱子
              const box = boxes.find(b => b.r === r && b.c === c);
              if (box) {
                const boxEl = document.createElement('div');
                boxEl.className = `box ${SHAPES[box.shapeId].class}`;
                boxEl.textContent = SHAPES[box.shapeId].symbol;

                if (target && target.shapeId === box.shapeId) {
                  boxEl.classList.add('matched');
                }
                cell.appendChild(boxEl);
              }
            }

            gameGrid.appendChild(cell);
          }
        }
      }

      // 更新 HUD
      function updateHUD() {
        hudSteps.textContent = stepCount;

        let matchedCount = 0;
        boxes.forEach(b => {
          const t = targets.find(target => target.r === b.r && target.c === b.c);
          if (t && t.shapeId === b.shapeId) {
            matchedCount++;
          }
        });

        hudMatched.textContent = `${matchedCount} / ${boxes.length}`;
      }

      // 全域同步滑移算法 (Global Simultaneous Slide Engine)
      function slideBoxes(dr, dc) {
        // 依據滑動方向對盒子進行排序，確保前端的盒子先滑動
        let sortedBoxes = [...boxes];
        if (dr === -1) sortedBoxes.sort((a, b) => a.r - b.r);        // 向上：上方的盒子先移動
        else if (dr === 1) sortedBoxes.sort((a, b) => b.r - a.r);   // 向下：下方的盒子先移動
        else if (dc === -1) sortedBoxes.sort((a, b) => a.c - b.c);  // 向左：左側的盒子先移動
        else if (dc === 1) sortedBoxes.sort((a, b) => b.c - a.c);   // 向右：右側的盒子先移動

        let movedAny = false;

        // 模擬推演所有盒子滑動至撞牆或撞到其他盒子
        sortedBoxes.forEach(box => {
          let currR = box.r;
          let currC = box.c;

          while (true) {
            let nextR = currR + dr;
            let nextC = currC + dc;

            // 檢查邊界與牆壁
            if (nextR < 0 || nextR >= gridHeight || nextC < 0 || nextC >= gridWidth || walls[nextR][nextC]) {
              break;
            }

            // 檢查是否碰撞到其他已停止的盒子
            if (boxes.some(b => b !== box && b.r === nextR && b.c === nextC)) {
              break;
            }

            currR = nextR;
            currC = nextC;
            movedAny = true;
          }

          box.r = currR;
          box.c = currC;
        });

        if (movedAny) {
          saveHistory();
          stepCount++;
          playSound('slide');
          renderBoard();
          updateHUD();
          checkVictory();
        }
      }

      // 歷史備份與復原
      function saveHistory() {
        historyStack.push({
          boxes: boxes.map(b => ({ ...b })),
          stepCount: stepCount
        });
      }

      function undoMove() {
        if (historyStack.length === 0) return;
        const lastState = historyStack.pop();
        boxes = lastState.boxes;
        stepCount = lastState.stepCount;
        playSound('slide');
        renderBoard();
        updateHUD();
      }

      // 檢查通關
      function checkVictory() {
        const allMatched = boxes.every(b => {
          const t = targets.find(target => target.r === b.r && target.c === b.c);
          return t && t.shapeId === b.shapeId;
        });

        if (allMatched) {
          if (!clearedLevels.includes(currentLevelIndex)) {
            clearedLevels.push(currentLevelIndex);
            localStorage.setItem('cyberslide_cleared', JSON.stringify(clearedLevels));
          }

          renderLevelSelector();

          if (clearedLevels.length === LEVELS.length) {
            playSound('clear');
            setTimeout(() => winModal.classList.add('active'), 300);
          } else {
            playSound('match');
            if (currentLevelIndex < LEVELS.length - 1) {
              setTimeout(() => loadLevel(currentLevelIndex + 1), 600);
            }
          }
        }
      }

      // 鍵盤事件綁定
      document.addEventListener('keydown', (e) => {
        switch (e.key) {
          case 'ArrowUp': case 'w': case 'W': slideBoxes(-1, 0); break;
          case 'ArrowDown': case 's': case 'S': slideBoxes(1, 0); break;
          case 'ArrowLeft': case 'a': case 'A': slideBoxes(0, -1); break;
          case 'ArrowRight': case 'd': case 'D': slideBoxes(0, 1); break;
          case 'z': case 'Z': undoMove(); break;
        }
      });

      // 觸控 D-Pad 綁定
      document.getElementById('btn-up').addEventListener('click', () => slideBoxes(-1, 0));
      document.getElementById('btn-down').addEventListener('click', () => slideBoxes(1, 0));
      document.getElementById('btn-left').addEventListener('click', () => slideBoxes(0, -1));
      document.getElementById('btn-right').addEventListener('click', () => slideBoxes(0, 1));

      // 控制鈕按鈕事件
      btnUndo.addEventListener('click', undoMove);
      btnRestart.addEventListener('click', () => loadLevel(currentLevelIndex));
      btnPrev.addEventListener('click', () => { if (currentLevelIndex > 0) loadLevel(currentLevelIndex - 1); });
      btnNext.addEventListener('click', () => { if (currentLevelIndex < LEVELS.length - 1) loadLevel(currentLevelIndex + 1); });

      soundBtn.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        soundBtn.textContent = `音效: ${soundEnabled ? 'ON' : 'OFF'}`;
      });

      resetProgressBtn.addEventListener('click', () => {
        if (confirm('確定要重設所有關卡紀錄嗎？')) {
          clearedLevels = [];
          localStorage.removeItem('cyberslide_cleared');
          loadLevel(0);
        }
      });

      modalCloseBtn.addEventListener('click', () => {
        winModal.classList.remove('active');
      });

      // 初始化遊戲
      loadLevel(0);
    });
  </script>
</body>
</html>
