<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberShift: 幾何矩陣 - 匿名箱子全域單格版</title>
  <!-- Google Fonts: Orbitron & Rajdhani -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       CyberShift Design System - 開頭頁面加大字體 & 逐關解鎖風格
       ========================================================================== */
    :root {
      --bg-dark: #080a0f;
      --panel-bg: #111622;
      --border-color: #2a364f;
      --neon-cyan: #00f3ff;
      --neon-green: #00ff66;
      --neon-red: #ff0055;
      --font-tech: 'Orbitron', sans-serif;
      --font-num: 'Rajdhani', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #1a2233 0%, var(--bg-dark) 100%);
      color: #e2e8f0;
      font-family: var(--font-tech);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* CRT 復古掃描線效果 */
    .crt-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.25) 50%
      ), linear-gradient(
        90deg,
        rgba(255, 0, 0, 0.02),
        rgba(0, 255, 0, 0.01),
        rgba(0, 0, 255, 0.02)
      );
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
      z-index: 999;
    }

    /* ==========================================================================
       🚀 開頭頁面 Overlay (大字體升級版)
       ========================================================================== */
    .start-screen {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at center, #182234 0%, #06080d 100%);
      z-index: 2000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-y: auto;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    .start-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .start-card {
      background: #0d121d;
      border: 2px solid var(--neon-cyan);
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 760px;
      width: 95%;
      text-align: center;
      box-shadow: 0 0 40px rgba(0, 243, 255, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .start-title {
      font-family: var(--font-tech);
      font-size: 3.8rem;
      font-weight: 900;
      color: var(--neon-cyan);
      letter-spacing: 4px;
      text-shadow: 0 0 25px rgba(0, 243, 255, 0.8), 0 0 50px rgba(0, 243, 255, 0.4);
      line-height: 1.15;
      margin-bottom: 6px;
    }

    .start-title-sub {
      font-size: 3rem;
      color: #ffffff;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
    }

    .start-subtitle {
      font-size: 1.25rem;
      color: #8da2c0;
      letter-spacing: 3px;
      margin-bottom: 28px;
    }

    /* 操作說明卡片 */
    .instructions-box {
      background: #070a10;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 22px 28px;
      text-align: left;
      width: 100%;
      margin-bottom: 32px;
    }

    .instructions-title {
      color: var(--neon-cyan);
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .instructions-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .instructions-list li {
      font-size: 1.2rem;
      color: #cbd5e1;
      line-height: 1.6;
    }

    .badge-key {
      color: var(--neon-cyan);
      font-weight: bold;
      background: rgba(0, 243, 255, 0.12);
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid rgba(0, 243, 255, 0.3);
    }

    /* 巨型遊戲開始按鈕 */
    .btn-start-game {
      background: linear-gradient(180deg, #00f3ff 0%, #0088aa 100%);
      border: 2px solid #ffffff;
      color: #000;
      font-family: var(--font-tech);
      font-size: 1.8rem;
      font-weight: 900;
      padding: 18px 48px;
      border-radius: 10px;
      cursor: pointer;
      letter-spacing: 3px;
      box-shadow: 0 0 30px var(--neon-cyan);
      width: 100%;
      transition: all 0.25s ease;
      animation: pulse-start 1.8s infinite alternate;
    }

    .btn-start-game:hover {
      transform: scale(1.04);
      box-shadow: 0 0 45px var(--neon-cyan), inset 0 0 15px #ffffff;
      background: #00f3ff;
    }

    .btn-start-game:active {
      transform: scale(0.97);
    }

    @keyframes pulse-start {
      0% { box-shadow: 0 0 18px rgba(0, 243, 255, 0.6); }
      100% { box-shadow: 0 0 38px rgba(0, 243, 255, 1); }
    }

    /* 主框架 */
    .game-wrapper {
      width: 96%;
      max-width: 900px;
      background: var(--panel-bg);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 
        0 0 35px rgba(0, 243, 255, 0.2),
        inset 0 0 15px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* 頂部 Header */
    .game-header {
      background: #171d2c;
      padding: 14px 22px;
      border-bottom: 2px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .game-title {
      font-family: var(--font-tech);
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--neon-cyan);
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.6);
    }

    .game-subtitle {
      font-size: 0.75rem;
      color: #6a7b95;
      letter-spacing: 1px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 6px 12px;
      font-family: var(--font-tech);
      font-size: 0.8rem;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background: rgba(0, 243, 255, 0.2);
      box-shadow: 0 0 8px rgba(0, 243, 255, 0.4);
    }

    /* 主體區塊 */
    .game-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 關卡選單 (未解鎖呈 .locked 鎖定狀態) */
    .level-selector-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 6px;
      width: 100%;
      max-width: 680px;
      margin-bottom: 12px;
    }

    .lvl-btn {
      padding: 6px 0;
      background: #141a26;
      border: 1px solid var(--border-color);
      color: #586980;
      font-family: var(--font-num);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .lvl-btn:hover:not(.locked) {
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
    }

    .lvl-btn.active {
      border-color: var(--neon-cyan);
      color: #000;
      background: var(--neon-cyan);
      box-shadow: 0 0 10px var(--neon-cyan);
    }

    .lvl-btn.cleared {
      border-color: var(--neon-green);
      color: var(--neon-green);
      background: rgba(0, 255, 102, 0.12);
    }

    .lvl-btn.cleared.active {
      background: var(--neon-green);
      color: #000;
      box-shadow: 0 0 10px var(--neon-green);
    }

    /* 鎖定關卡樣式 */
    .lvl-btn.locked {
      opacity: 0.35;
      cursor: not-allowed;
      border-color: #222e40;
      background: #0b0e17;
      color: #3b485d;
    }

    /* HUD 看板 */
    .hud-info {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 580px;
      background: #0d111a;
      border: 1px solid var(--border-color);
      padding: 8px 18px;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .hud-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hud-label {
      font-size: 0.7rem;
      color: #6a7b95;
    }

    .hud-val {
      font-family: var(--font-num);
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
    }

    /* 核心地圖大畫布 */
    .board-container {
      background: #06080d;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 12px;
      min-height: 380px;
      width: 100%;
      max-width: 680px;
      overflow: auto;
    }

    .game-grid {
      display: grid;
      gap: 3px;
    }

    .cell {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* 虛無 / 外界 (Void) */
    .cell.void {
      background: transparent;
      border: none;
    }

    /* 牆壁 (Metallic Wall) */
    .cell.wall {
      background: linear-gradient(135deg, #283244 0%, #151c28 100%);
      border: 1px solid #3c4b66;
      box-shadow: inset 0 0 5px rgba(255, 255, 255, 0.12);
    }

    /* 地板 (Floor) */
    .cell.floor {
      background: rgba(18, 24, 36, 0.75);
      border: 1px solid rgba(42, 54, 79, 0.4);
    }

    /* 虛線目標點 Target */
    .target-icon {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: 2px dashed var(--neon-cyan);
      box-shadow: inset 0 0 8px rgba(0, 243, 255, 0.3);
      animation: pulse-glow 2s infinite alternate;
    }

    @keyframes pulse-glow {
      0% { transform: scale(0.92); opacity: 0.5; }
      100% { transform: scale(1.05); opacity: 0.95; }
    }

    /* 動態方塊 Box (預設金屬藍) */
    .box {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: radial-gradient(circle at 30% 30%, #00f3ff, #005588);
      border: 2px solid #ffffff;
      box-shadow: 0 0 12px var(--neon-cyan);
      z-index: 10;
      transition: all 0.15s ease-out;
    }

    /* 盒子到達目標位置時：變亮綠色，且下方虛線會被遮蓋不顯示 */
    .box.matched {
      background: radial-gradient(circle at 30% 30%, #00ff66, #008833);
      border-color: #ffffff;
      box-shadow: 0 0 18px var(--neon-green);
      animation: box-matched-bounce 0.3s ease-out;
    }

    @keyframes box-matched-bounce {
      0% { transform: scale(0.85); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    /* 控制面板 */
    .control-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .action-buttons {
      display: flex;
      gap: 12px;
    }

    .btn-cyber {
      background: linear-gradient(180deg, #1e2838 0%, #101622 100%);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      font-family: var(--font-tech);
      font-size: 0.85rem;
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 4px;
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    .btn-cyber:hover:not(:disabled) {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 12px var(--neon-cyan);
    }

    .btn-cyber:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: #2c384e;
    }

    /* 長方形 2x2 控制面板 */
    .dpad-container {
      display: grid;
      grid-template-columns: repeat(2, 95px);
      grid-template-rows: repeat(2, 54px);
      gap: 8px;
      padding: 10px;
      background: #0b0f17;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.9), 0 0 15px rgba(0, 243, 255, 0.15);
    }

    .dpad-btn {
      background: linear-gradient(145deg, #182232, #0f1622);
      border: 1.5px solid var(--neon-cyan);
      color: var(--neon-cyan);
      font-size: 1.3rem;
      font-weight: bold;
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.1s ease;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
    }

    /* 按下狀態：亮高飽和螢光青色 */
    .dpad-btn:active, .dpad-btn.pressed {
      background: var(--neon-cyan);
      color: #080a0f;
      border-color: #ffffff;
      box-shadow: 0 0 22px var(--neon-cyan), inset 0 0 10px #ffffff;
      transform: scale(0.94);
    }

    .dpad-up { grid-column: 1; grid-row: 1; }
    .dpad-down { grid-column: 2; grid-row: 1; }
    .dpad-left { grid-column: 1; grid-row: 2; }
    .dpad-right { grid-column: 2; grid-row: 2; }

    /* 通關 Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(5, 7, 10, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active { display: flex; }

    .modal-panel {
      background: linear-gradient(135deg, #1a2233 0%, #0d111a 100%);
      border: 2px solid var(--neon-green);
      padding: 35px;
      border-radius: 10px;
      text-align: center;
      max-width: 450px;
      width: 90%;
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.3);
    }

    .modal-title {
      font-family: var(--font-tech);
      font-size: 1.8rem;
      color: var(--neon-green);
      text-shadow: 0 0 10px var(--neon-green);
      margin-bottom: 10px;
    }

    .modal-desc {
      color: #a0aec0;
      font-size: 0.95rem;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .start-title { font-size: 2.5rem; }
      .start-title-sub { font-size: 2rem; }
      .start-subtitle { font-size: 1rem; }
      .instructions-box { padding: 16px; }
      .instructions-list li { font-size: 1rem; }
      .btn-start-game { font-size: 1.4rem; padding: 14px 28px; }
      .level-selector-grid { grid-template-columns: repeat(5, 1fr); }
      .cell { width: 28px; height: 28px; }
      .box { width: 22px; height: 22px; }
      .target-icon { width: 20px; height: 20px; }
      .dpad-container { grid-template-columns: repeat(2, 75px); grid-template-rows: repeat(2, 45px); }
      .game-title { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <div class="crt-overlay"></div>

  <!-- 🚀 開頭頁面 (Start Screen Overlay) -->
  <div id="start-screen" class="start-screen">
    <div class="start-card">
      <h1 class="start-title">CyberShift<br><span class="start-title-sub">幾何矩陣</span></h1>
      <p class="start-subtitle">CYBERPUNK SOKOBAN MATRIX PUZZLE</p>

      <div class="instructions-box">
        <h2 class="instructions-title">🎮 操作說明</h2>
        <ul class="instructions-list">
          <li>・點擊畫面按鈕或 <span class="badge-key">W A S D / 方向鍵</span> 移動所有箱子</li>
          <li>・<span class="badge-key">按鍵 Z</span>：復原上一步動作</li>
          <li>・<span class="badge-key" style="color:var(--neon-green); border-color:var(--neon-green);">規則</span>：將所有藍色金屬箱推至目標點即可通關並解鎖下一關！</li>
        </ul>
      </div>

      <button id="btn-start-game" class="btn-start-game">遊戲開始 START GAME</button>
    </div>
  </div>

  <!-- 遊戲主體 -->
  <div class="game-wrapper">
    <header class="game-header">
      <div>
        <h1 class="game-title">CyberShift // 幾何矩陣</h1>
        <p class="game-subtitle">ANONYMOUS BOXES - OPEN MATRIX PUZZLE</p>
      </div>
      <div class="header-actions">
        <button id="sound-btn" class="btn-icon">音效: ON</button>
        <button id="btn-home" class="btn-icon">返回首頁</button>
      </div>
    </header>

    <main class="game-body">
      <!-- 關卡選擇 -->
      <div id="level-grid" class="level-selector-grid"></div>

      <!-- HUD 看板 -->
      <div class="hud-info">
        <div class="hud-item">
          <span class="hud-label">當前關卡</span>
          <span id="hud-level" class="hud-val">01 / 10</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">移動步數</span>
          <span id="hud-steps" class="hud-val">0</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">目標對位</span>
          <span id="hud-matched" class="hud-val">0 / 1</span>
        </div>
      </div>

      <!-- 不規則大遊戲網格 -->
      <div class="board-container">
        <div id="game-grid" class="game-grid"></div>
      </div>

      <!-- 操作面板 -->
      <div class="control-panel">
        <div class="action-buttons">
          <button id="btn-undo" class="btn-cyber">復原 (Undo)</button>
          <button id="btn-restart" class="btn-cyber">重置本關</button>
          <button id="btn-prev" class="btn-cyber">上一關</button>
          <button id="btn-next" class="btn-cyber">下一關</button>
        </div>

        <!-- 長方形 2x2 控制區域 -->
        <div class="dpad-container">
          <button class="dpad-btn dpad-up" id="btn-up">▲ 上</button>
          <button class="dpad-btn dpad-down" id="btn-down">▼ 下</button>
          <button class="dpad-btn dpad-left" id="btn-left">◀ 左</button>
          <button class="dpad-btn dpad-right" id="btn-right">▶ 右</button>
        </div>
      </div>
    </main>
  </div>

  <!-- 通關 Modal -->
  <div id="win-modal" class="modal-overlay">
    <div class="modal-panel">
      <h2 class="modal-title">ALL STAGES ALIGNED</h2>
      <p class="modal-desc">
        恭喜！您已成功掌握全域單格移位，完成全部 10 個不規則幾何關卡！
      </p>
      <button id="modal-close-btn" class="btn-cyber" style="border-color:var(--neon-green); color:var(--neon-green);">返回關卡</button>
    </div>
  </div>

  <script>
    /**
     * CyberShift Engine (Start Screen & Sequential Level Unlock Engine)
     */
    document.addEventListener('DOMContentLoaded', () => {
      // 10 個經過演算法 100% 驗證、無角落死角設計的不規則關卡
      const LEVELS = [
        {
          name: "關卡 01: 錯位大廳 (9x7)",
          map: [
            "  #######  ",
            "###.....###",
            "#B.......T#",
            "#...#.#...#",
            "#B.......T#",
            "###.....###",
            "  #######  "
          ]
        },
        {
          name: "關卡 02: 雙柱縱橫 (10x8)",
          map: [
            "##########",
            "#B......T#",
            "#..####..#",
            "#.#....#.#",
            "#.#.T..#.#",
            "#B#....#.#",
            "#...####.#",
            "##########"
          ]
        },
        {
          name: "關卡 03: T型交錯點 (10x8)",
          map: [
            "##########",
            "#B......T#",
            "#...##...#",
            "###....###",
            "  #....#  ",
            "  #B..T#  ",
            "  #....#  ",
            "  ######  "
          ]
        },
        {
          name: "關卡 04: 三體平行迴廊 (11x9)",
          map: [
            "  #######  ",
            "###.....###",
            "#B.......T#",
            "#...#.#...#",
            "#B...T....#",
            "#...#.#...#",
            "#B.......T#",
            "###.....###",
            "  #######  "
          ]
        },
        {
          name: "關卡 05: 異形交錯隔間 (10x9)",
          map: [
            "##########",
            "#B......T#",
            "#..#####.#",
            "##...#...#",
            "#B...#.T.#",
            "#....#...#",
            "#....#####",
            "#B......T#",
            "##########"
          ]
        },
        {
          name: "關卡 06: 環形偏移迴道 (11x9)",
          map: [
            "###########",
            "#B.......T#",
            "#.#######.#",
            "#.#.....#.#",
            "#.#.B.T.#.#",
            "#.#.....#.#",
            "#.#######.#",
            "#B.......T#",
            "###########"
          ]
        },
        {
          name: "關卡 07: 幾何八角廳 (11x11)",
          map: [
            "    #####    ",
            "  ###...###  ",
            " ##.......## ",
            "##B...#...T##",
            "#.....#.....#",
            "#...#####...#",
            "#.....#.....#",
            "##B...#...T##",
            " ##.......## ",
            "  ###...###  ",
            "    #####    "
          ]
        },
        {
          name: "關卡 08: 四象矩陣長廊 (12x10)",
          map: [
            "############",
            "#B........T#",
            "#..######..#",
            "#B.#....#.T#",
            "#..#.T..#..#",
            "#..#..B.#..#",
            "#B.#....#.T#",
            "#..######..#",
            "#..........#",
            "############"
          ]
        },
        {
          name: "關卡 09: 雙環對位階梯 (11x11)",
          map: [
            "###########",
            "#B.......T#",
            "#.#######.#",
            "#.#.....#.#",
            "#.#.B.T.#.#",
            "#.#.....#.#",
            "#.#.B.T.#.#",
            "#.#.....#.#",
            "#.#######.#",
            "#.........#",
            "###########"
          ]
        },
        {
          name: "關卡 10: 終極幾何矩陣 (12x8)",
          map: [
            "############",
            "#B........T#",
            "#.##.##.##.#",
            "#...B..T...#",
            "##.######.##",
            "#...B..T...#",
            "#.##.##.##.#",
            "#B........T#",
            "############"
          ]
        }
      ];

      // 遊戲狀態變數
      let currentLevelIndex = 0;
      let gridWidth = 0;
      let gridHeight = 0;
      let mapCells = [];  // 2D Array: 'void', 'wall', 'floor'
      let targets = [];   // [{ r, c }]
      let boxes = [];     // [{ r, c }]
      let historyStack = [];
      let stepCount = 0;
      let soundEnabled = true;

      // 關卡通關陣列（每次重開啟網頁必定清空從頭開始）
      let clearedLevels = [];

      // DOM 引用
      const startScreen = document.getElementById('start-screen');
      const btnStartGame = document.getElementById('btn-start-game');
      const btnHome = document.getElementById('btn-home');

      const levelGrid = document.getElementById('level-grid');
      const gameGrid = document.getElementById('game-grid');
      const hudLevel = document.getElementById('hud-level');
      const hudSteps = document.getElementById('hud-steps');
      const hudMatched = document.getElementById('hud-matched');

      const btnUndo = document.getElementById('btn-undo');
      const btnRestart = document.getElementById('btn-restart');
      const btnPrev = document.getElementById('btn-prev');
      const btnNext = document.getElementById('btn-next');
      const soundBtn = document.getElementById('sound-btn');

      const winModal = document.getElementById('win-modal');
      const modalCloseBtn = document.getElementById('modal-close-btn');

      // D-Pad 按鈕 DOM
      const dpadUp = document.getElementById('btn-up');
      const dpadDown = document.getElementById('btn-down');
      const dpadLeft = document.getElementById('btn-left');
      const dpadRight = document.getElementById('btn-right');

      // Web Audio API 音效引擎
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      function playSound(type) {
        if (!soundEnabled) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'step') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(360, now);
          osc.frequency.exponentialRampToValueAtTime(220, now + 0.05);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
        } else if (type === 'match') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'clear') {
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g);
            g.connect(audioCtx.destination);
            o.frequency.value = freq;
            g.gain.setValueAtTime(0.15, now + i * 0.08);
            g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.25);
            o.start(now + i * 0.08);
            o.stop(now + i * 0.08 + 0.25);
          });
        }
      }

      // 判斷關卡是否解鎖（第 1 關預設解鎖；其餘需完成前一關）
      function isLevelUnlocked(idx) {
        if (idx === 0) return true;
        return clearedLevels.includes(idx - 1);
      }

      // 渲染關卡選單 (未解鎖顯示 🔒 且無法點擊)
      function renderLevelSelector() {
        levelGrid.innerHTML = '';
        LEVELS.forEach((lvl, idx) => {
          const btn = document.createElement('button');
          const unlocked = isLevelUnlocked(idx);

          let className = 'lvl-btn';
          if (!unlocked) {
            className += ' locked';
          } else {
            if (idx === currentLevelIndex) className += ' active';
            if (clearedLevels.includes(idx)) className += ' cleared';
          }

          btn.className = className;
          btn.textContent = unlocked ? String(idx + 1).padStart(2, '0') : '🔒';

          if (unlocked) {
            btn.addEventListener('click', () => loadLevel(idx));
          }

          levelGrid.appendChild(btn);
        });
      }

      // 解析並載入關卡
      function loadLevel(idx) {
        if (!isLevelUnlocked(idx)) return;

        currentLevelIndex = idx;
        const levelData = LEVELS[idx];
        const mapStrings = levelData.map;

        gridHeight = mapStrings.length;
        gridWidth = Math.max(...mapStrings.map(s => s.length));

        mapCells = Array.from({ length: gridHeight }, () => new Array(gridWidth).fill('void'));
        targets = [];
        boxes = [];
        historyStack = [];
        stepCount = 0;

        for (let r = 0; r < gridHeight; r++) {
          const rowStr = mapStrings[r];
          for (let c = 0; c < rowStr.length; c++) {
            const ch = rowStr[c];
            if (ch === '#') {
              mapCells[r][c] = 'wall';
            } else if (ch === '.') {
              mapCells[r][c] = 'floor';
            } else if (ch === 'T') {
              mapCells[r][c] = 'floor';
              targets.push({ r, c });
            } else if (ch === 'B') {
              mapCells[r][c] = 'floor';
              boxes.push({ r, c });
            } else {
              mapCells[r][c] = 'void';
            }
          }
        }

        hudLevel.textContent = `${String(idx + 1).padStart(2, '0')} / ${LEVELS.length}`;
        btnPrev.disabled = (idx === 0);
        btnNext.disabled = (idx === LEVELS.length - 1 || !isLevelUnlocked(idx + 1));

        renderLevelSelector();
        renderBoard();
        updateHUD();
      }

      // 渲染地圖 Grid
      function renderBoard() {
        gameGrid.style.gridTemplateColumns = `repeat(${gridWidth}, 1fr)`;
        gameGrid.innerHTML = '';

        let cellSize = 40;
        if (gridWidth > 10) cellSize = 34;

        for (let r = 0; r < gridHeight; r++) {
          for (let c = 0; c < gridWidth; c++) {
            const cell = document.createElement('div');
            cell.className = `cell ${mapCells[r][c]}`;
            cell.style.width = `${cellSize}px`;
            cell.style.height = `${cellSize}px`;

            if (mapCells[r][c] === 'floor') {
              const target = targets.find(t => t.r === r && t.c === c);
              const box = boxes.find(b => b.r === r && b.c === c);

              // 只有當「沒有箱子」停在該位置時，才渲染虛線目標點；當有箱子時完全不顯示虛線
              if (target && !box) {
                const targetIcon = document.createElement('div');
                targetIcon.className = 'target-icon';
                cell.appendChild(targetIcon);
              }

              // 渲染箱子
              if (box) {
                const boxEl = document.createElement('div');
                boxEl.className = 'box';

                // 當箱子位在目標點時：套用 .matched 樣式變綠色
                if (target) {
                  boxEl.classList.add('matched');
                }
                cell.appendChild(boxEl);
              }
            }

            gameGrid.appendChild(cell);
          }
        }
      }

      // 更新 HUD 看板
      function updateHUD() {
        hudSteps.textContent = stepCount;

        let matchedCount = 0;
        targets.forEach(t => {
          if (boxes.some(b => b.r === t.r && b.c === t.c)) {
            matchedCount++;
          }
        });

        hudMatched.textContent = `${matchedCount} / ${targets.length}`;
      }

      // ⚡⚡⚡ 全域單格同步平移演算法 ⚡⚡⚡
      function moveBoxes(dr, dc) {
        // 首頁開著時不觸發移動
        if (!startScreen.classList.contains('hidden')) return;

        let sortedBoxes = [...boxes];
        if (dr === -1) sortedBoxes.sort((a, b) => a.r - b.r);        // 向上
        else if (dr === 1) sortedBoxes.sort((a, b) => b.r - a.r);   // 向下
        else if (dc === -1) sortedBoxes.sort((a, b) => a.c - b.c);  // 向左
        else if (dc === 1) sortedBoxes.sort((a, b) => b.c - a.c);   // 向右

        let movedAny = false;

        sortedBoxes.forEach(box => {
          let nextR = box.r + dr;
          let nextC = box.c + dc;

          if (nextR >= 0 && nextR < gridHeight && nextC >= 0 && nextC < gridWidth && mapCells[nextR][nextC] === 'floor') {
            if (!boxes.some(b => b !== box && b.r === nextR && b.c === nextC)) {
              box.r = nextR;
              box.c = nextC;
              movedAny = true;
            }
          }
        });

        if (movedAny) {
          saveHistory();
          stepCount++;
          playSound('step');
          renderBoard();
          updateHUD();
          checkVictory();
        }
      }

      // 歷史備份與 Undo
      function saveHistory() {
        historyStack.push({
          boxes: boxes.map(b => ({ ...b })),
          stepCount: stepCount
        });
      }

      function undoMove() {
        if (historyStack.length === 0) return;
        const lastState = historyStack.pop();
        boxes = lastState.boxes;
        stepCount = lastState.stepCount;
        playSound('step');
        renderBoard();
        updateHUD();
      }

      // 檢查通關（條件：所有目標點都有箱子）
      function checkVictory() {
        const allTargetsFilled = targets.every(t => boxes.some(b => b.r === t.r && b.c === t.c));

        if (allTargetsFilled) {
          if (!clearedLevels.includes(currentLevelIndex)) {
            clearedLevels.push(currentLevelIndex);
          }

          renderLevelSelector();

          // 啟用下一關按鈕
          if (currentLevelIndex < LEVELS.length - 1) {
            btnNext.disabled = false;
          }

          if (clearedLevels.length === LEVELS.length) {
            playSound('clear');
            setTimeout(() => winModal.classList.add('active'), 300);
          } else {
            playSound('match');
            if (currentLevelIndex < LEVELS.length - 1) {
              setTimeout(() => loadLevel(currentLevelIndex + 1), 500);
            }
          }
        }
      }

      // 按鍵發光反饋
      function triggerButtonEffect(btn) {
        if (!btn) return;
        btn.classList.add('pressed');
        setTimeout(() => btn.classList.remove('pressed'), 120);
      }

      // 🚀 開始遊戲（重頭開始第一關）
      function startNewGame() {
        clearedLevels = []; // 清空關卡進度
        startScreen.classList.add('hidden');
        loadLevel(0); // 從第一關重新開始
      }

      // 🏠 返回開頭頁面
      function goToHomeScreen() {
        startScreen.classList.remove('hidden');
      }

      // 綁定按鈕與首頁事件
      btnStartGame.addEventListener('click', startNewGame);
      btnHome.addEventListener('click', goToHomeScreen);

      // 鍵盤事件綁定
      document.addEventListener('keydown', (e) => {
        // 在首頁時按 Enter 直接開始遊戲
        if (!startScreen.classList.contains('hidden')) {
          if (e.key === 'Enter') {
            startNewGame();
          }
          return;
        }

        switch (e.key) {
          case 'ArrowUp': case 'w': case 'W':
            triggerButtonEffect(dpadUp);
            moveBoxes(-1, 0);
            break;
          case 'ArrowDown': case 's': case 'S':
            triggerButtonEffect(dpadDown);
            moveBoxes(1, 0);
            break;
          case 'ArrowLeft': case 'a': case 'A':
            triggerButtonEffect(dpadLeft);
            moveBoxes(0, -1);
            break;
          case 'ArrowRight': case 'd': case 'D':
            triggerButtonEffect(dpadRight);
            moveBoxes(0, 1);
            break;
          case 'z': case 'Z':
            undoMove();
            break;
        }
      });

      // 觸控 / 滑鼠 D-Pad 綁定
      dpadUp.addEventListener('click', () => moveBoxes(-1, 0));
      dpadDown.addEventListener('click', () => moveBoxes(1, 0));
      dpadLeft.addEventListener('click', () => moveBoxes(0, -1));
      dpadRight.addEventListener('click', () => moveBoxes(0, 1));

      // 控制鈕按鈕事件
      btnUndo.addEventListener('click', undoMove);
      btnRestart.addEventListener('click', () => loadLevel(currentLevelIndex));
      btnPrev.addEventListener('click', () => { if (currentLevelIndex > 0) loadLevel(currentLevelIndex - 1); });
      btnNext.addEventListener('click', () => { if (currentLevelIndex < LEVELS.length - 1 && isLevelUnlocked(currentLevelIndex + 1)) loadLevel(currentLevelIndex + 1); });

      soundBtn.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        soundBtn.textContent = `音效: ${soundEnabled ? 'ON' : 'OFF'}`;
      });

      modalCloseBtn.addEventListener('click', () => {
        winModal.classList.remove('active');
      });

      // 初始化：每次開啟或重新載入網頁，必定從開頭頁面開始
      goToHomeScreen();
    });
  </script>
